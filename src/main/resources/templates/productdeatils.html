<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* Style for the card */
        .card {
    background-color: #ffffff;
    border: 2px solid #3498db;
    border-radius: 8px;
    padding: 15px;
    margin: 20px auto;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
    max-width: 100%; /* Ensures card doesn't exceed container width */
}

.card-img-top {
    max-width: 100%; /* Ensures image doesn't exceed card width */
    height: auto;
    margin-bottom: 10px;
    border-radius: 8px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

        .card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            text-align: center;
        }
       
        .card-price {
            font-size: 1.2em;
            margin: 15px 0;
        }
        .original-price {
            text-decoration: line-through;
            color: #666;
        }
        .discounted-price {
            font-weight: bold;
            color: #28a745;
        }
        .discount-percentage {
            color: #dc3545;
        }
        .stock-status {
            font-size: 1em;
            color: #28a745;
        }
        .out-of-stock {
            color: #dc3545; /* Red color for out of stock */
        }
        .btn-primary {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Product Details</h1>
    <div id="product-details">
        <div class="col-md-4">
            <div class="card h-100 w-80">
                <img id="productImage" src="/images/d1.jpg" class="card-img-top" alt="Product Image">
                <div class="card-body">
                    <h5 class="card-title" id="productName">Product Name</h5>
                    <p class="card-text" id="productDescription">Product description goes here.</p>
                    <p class="card-price">
                        <span class="original-price" id="originalPrice">$0.00</span> 
                        <span class="discounted-price" id="discountedPrice">$0.00</span> 
                        <span class="discount-percentage" id="discountPercentage">(0% off)</span>
                    </p>
                    <p class="stock-status">
                        <span id="inStockStatus">Checking stock status...</span>
                    </p>
                    <button id="buyButton" class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        function getProductIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function fetchProduct() {
            const productId = getProductIdFromUrl();
            if (!productId) {
                alert('Product ID is missing from the URL');
                return;
            }

            fetch(`http://localhost:8082/products/retrive/${productId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Product not found');
                    }
                    return response.json();
                })
                .then(product => {
                    const gstRate = 0.18; // GST rate of 18%
                    const originalPriceWithGst = product.originalPrice * (1 + gstRate);
                    const discountedPriceWithGst = product.discountedPrice * (1 + gstRate);

                    document.getElementById('productName').textContent = product.name;
                    document.getElementById('productDescription').textContent = product.description;
                    document.getElementById('originalPrice').textContent = `${originalPriceWithGst.toFixed(2)} Rs (incl. GST)`;
                    document.getElementById('discountedPrice').textContent = `${discountedPriceWithGst.toFixed(2)} Rs (incl. GST)`;
                    document.getElementById('discountPercentage').textContent = `${product.discountPercentage}% Off`;
                    document.getElementById('productImage').src = product.imageUrl ? product.imageUrl : '/images/d1.jpg';

                    const inStockStatus = document.getElementById('inStockStatus');
                    const buyButton = document.getElementById('buyButton');

                    if (product.inStock) {
                        inStockStatus.textContent = 'In Stock';
                        buyButton.classList.remove('btn-disabled');
                        buyButton.classList.add('btn-primary');
                        buyButton.style.pointerEvents = 'auto';

                        buyButton.addEventListener('click', () => {
                            const isLoggedIn = localStorage.getItem('isLoggedIn');
                            if (isLoggedIn) {
                                openRazorpayCheckout(product, discountedPriceWithGst);
                            } else {
                                alert('You need to be logged in to buy this product. Please sign in.');
                                window.location.href = '/signin';
                            }
                        });
                    } else {
                        inStockStatus.textContent = 'Out of Stock';
                        buyButton.classList.add('btn-disabled');
                        buyButton.style.pointerEvents = 'none';
                    }
                })
                .catch(error => {
                    document.getElementById('product-details').innerHTML = `<p class="error">Error: ${error.message}</p>`;
                });
        }

        function fetchOrderIdAndOpenCheckout(product, finalPrice) { 
        	fetch('http://localhost:8082/paymentOrder', {
        	    method: 'POST',
        	    headers: { 'Content-Type': 'application/json' },
        	    body: JSON.stringify({ amount: finalPrice * 100, productId: product.id })
        	})
        	.then(response => response.json())
        	.then(data => {
        	    if (data && data.response && data.response.orderId) {
        	        setTimeout(() => {
        	            openRazorpayCheckout(product, finalPrice, data.response.orderId);
        	        }, 2000); 
        	    } else {
        	        console.error('Order ID not returned by server:', data);
        	        alert('Failed to create order');
        	    }
        	})
        	.catch(error => {
        	    console.error('Error fetching order ID:', error.message);
        	    alert('Error fetching order ID: ' + error.message);
        	});

        }


        function openRazorpayCheckout(product, finalPrice, orderId) {
            const profile = JSON.parse(localStorage.getItem('profile')) || {};
            const userName = profile.name || "Guest User";
            const userEmail = profile.email || "user@example.com";
            const userContact = profile.phone || "9999999999";

            const options = {
                key: "rzp_test_t2INvChUAslTpz",
                amount: (finalPrice * 100), 
                currency: "INR",
                name: "Anaya",
                description: product.description,
                image: "/images/a1.jpg",
                order_id: orderId, 
                handler: function (response) {
                	setTimeout(() => {
                        window.location.href = `/invoice?payment_id=${response.razorpay_payment_id}&order_id=${response.razorpay_order_id}&product_id=${product.id}`;
                    }, 3000);
                },
                prefill: {
                    name: userName,
                    email: userEmail,
                    contact: userContact
                },
                theme: {
                    color: "#F37254"
                },
                notes: {
                    productName: product.name
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }


        window.onload = fetchProduct;
    </script>
</body>
</html>
