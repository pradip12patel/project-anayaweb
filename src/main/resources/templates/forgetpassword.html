<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    
    <style>
        .img-circle {
            border-radius: 50%;
            width: 180px; /* Adjust the size as needed */
            height: 180px; /* Adjust the size as needed */
            object-fit: cover; /* Ensures the image covers the circle area */
        }

    </style>
</head>
<body>

<!-- Row for Logo and Description -->
<header class="bg-primary text-white header-lg py-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-2">
                <img src="/images/20200614_095051.jpg" alt="Website Logo" class="img-circle logo-img">
            </div>
            <div class="col-md-10 text-middle">
                <h1 class="display-4">Anaya</h1>
                <p class="lead">My father is a constant source of strength and support in my life...</p>
            </div>
        </div>
    </div>
</header>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Forgot Password</h4>
                </div>
                <div class="card-body">
                    <form id="forgotPasswordForm" action="/forgetpassword" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="resetButton">Reset Password</button>
                    </form>

                    <!-- Display message after form submission -->
                    <p class="mt-3 text-success" id="message"></p>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('forgotPasswordForm');
        const messageElement = document.getElementById('message');
        const resetButton = document.getElementById('resetButton');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 

            var email = document.getElementById('email').value;

            
            fetch('http://localhost:8082/api/forgetpassword', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => {
                if (response.status === 200) {
                    return response.text(); 
                } else if (response.status === 404) {
                    throw new Error('Email not found'); 
                } else {
                    throw new Error('Network response was not ok');
                }
            })
            .then(data => {
             
                messageElement.textContent = data;
                messageElement.classList.remove('text-danger');
                messageElement.classList.add('text-success');

                
                resetButton.textContent = 'Sent Successfully';
                resetButton.classList.remove('btn-primary');
                resetButton.classList.add('btn-success');
                resetButton.disabled = true; 
            })
            .catch(error => {
               
                if (error.message === 'Email not found') {
                    messageElement.textContent = 'Email not found. Please try again.';
                } else {
                    messageElement.textContent = 'An error occurred while trying to reset the password. Please try again.';
                }
                messageElement.classList.remove('text-success');
                messageElement.classList.add('text-danger');
                console.error('Error:', error);
            });
        });
    });
</script>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
