<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .card {
            margin-bottom: 20px;
        }
        .img-thumbnail {
            width: 200px;
            height: 200px;
        }
        .item-checkbox {
            transform: scale(1.5); /* Increase checkbox size */
            margin-left: 120px; /* Add some space to the left */
        }
        .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        visibility: visible; /* Initially visible */
        opacity: 1; /* Initially fully visible */
        transition: opacity 0.3s ease, visibility 0s 0.3s;
    }

    .loader-overlay.hidden {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0s 0s;
    }

    .spinner-border {
        width: 3rem;
        height: 3rem;
        border-width: 0.3rem;
    }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center">Your Cart Items</h1>

    <div id="cartItems">
        <!-- Cart items will be displayed here -->
    </div>

    <button class="btn btn-primary mt-3" onclick="placeOrder()">Place Order</button>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || []; // Load cart from local storage

    // Function to update the cart display with dynamic images and quantity selection
    function updateCartDisplay() {
        const cartItemsDiv = document.getElementById('cartItems');
        cartItemsDiv.innerHTML = ''; // Clear previous cart items

        if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<p>No items in your cart yet.</p>';
            return;
        }

        cart.forEach((item, index) => {
            const cartItem = `
                <div class="card mb-3">
                    <div class="row no-gutters">
                        <div class="col-md-2">
                        <!-- Display the item image dynamically and link to the product details page -->
                        <a href="/productdeatils?id=${item.productId}">
                            <img src="${item.imageUrl || '/images/default.jpg'}" class="img-thumbnail" alt="${item.name}">
                        </a>
                        </div>
                        <div class="col-md-10">
                            <div class="card-body w-100px">
                                <h5 class="card-title">${item.name}</h5>
                                <p class="card-text">Price: ${item.price}Rs</p>
                                <div class="form-row align-items-center">
                                    <div class="col-auto">
                                        <label for="quantity${index}">Quantity:</label>
                                        <input type="number" id="quantity${index}" value="1" min="1" class="form-control w-50 d-inline" onchange="updateItemQuantity(${index}, this.value)">
                                    </div>
                                    <div class="col-auto ml-2">
                                        <input type="checkbox" id="itemCheckbox${index}" class="item-checkbox" data-index="${index}">
                                    </div>
                                </div>
                                <div class="form-row mt-2">
                                    <div class="col-auto">
                                        <button class="btn btn-secondary btn-sm" onclick="saveForLater(${index})">Save for Later</button>
                                    </div>
                                    <div class="col-auto">
                                        <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Remove</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            cartItemsDiv.innerHTML += cartItem;
        });
    }

    // Function to update the quantity of an item
    function updateItemQuantity(index, quantity) {
        cart[index].quantity = quantity; // Update quantity in cart array
        localStorage.setItem('cart', JSON.stringify(cart)); // Update local storage
    }

    // Function to save an item for later
    function saveForLater(index) {
        alert('Item saved for later: ' + cart[index].name);
    }

    // Function to remove an item from the cart
    function removeItem(index) {
        cart.splice(index, 1); // Remove item from cart array
        localStorage.setItem('cart', JSON.stringify(cart)); // Update local storage
        updateCartDisplay(); // Update cart display
        updateNotificationBadge(); // Update notification badge count
    }

    // Function to update the notification badge
    function updateNotificationBadge() {
        const notificationBadge = document.getElementById('notificationBadge');
        notificationBadge.innerText = cart.length; // Update the badge text with the number of items in the cart
    }

    // Call this function on page load to set the initial badge count
    document.addEventListener('DOMContentLoaded', function() {
        updateCartDisplay(); // Set the initial cart display
        updateNotificationBadge(); // Set the initial count based on local storage
    });

    // Function to place an order for selected items
function placeOrder() {
    const selectedItems = [];
    const checkboxes = document.querySelectorAll('.item-checkbox');

    checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
            const index = checkbox.getAttribute('data-index');
            const quantity = document.getElementById(`quantity${index}`).value; // Get quantity
            selectedItems.push({ 
                productId: cart[index].productId, // Access productId from cart
                name: cart[index].name, 
                price: cart[index].price, 
                quantity: quantity 
            });
        }
    });

    if (selectedItems.length > 0) {
        const queryParams = selectedItems.map(item => `productId=${item.productId}&quantity=${item.quantity}`).join('&');

        // Redirect to the product details or order summary page with query parameters
        window.location.href = `/productdetails?${queryParams}`;
    } else {
        alert('No items selected for order.');
    }
}


    // Call this function on page load to set the initial badge count
    document.addEventListener('DOMContentLoaded', function() {
        updateCartDisplay(); // Set the initial cart display
        updateNotificationBadge(); // Set the initial count based on local storage
    });
</script>


<script>
    // Check if the user is logged in
    document.addEventListener('DOMContentLoaded', () => {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (!isLoggedIn) {
            // Redirect users who are not logged in
            window.location.href = '/signin';
        }
    });
</script>


</body>
</html>
