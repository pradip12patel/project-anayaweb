<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign-in Successful</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <style>
        /* Custom styling for the success icon */
        .success-icon {
            font-size: 50px;
            color: green;
        }
    </style>

    <script>
        // Function to show Bootstrap modal on page load
        window.onload = function() {
            $('#successModal').modal('show');
        };

        // Function to navigate to the homepage after modal dismissal
        function redirectToHomepage() {
            window.location.href = "/homepage"; // Redirect to homepage
        }
    </script>
</head>
<body>
               
    <!-- Bootstrap Modal for success message -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <!-- Checkmark Icon -->
                    <div class="success-icon">
                        &#10004; <!-- Unicode for checkmark -->
                    </div>
                    <h4 class="mt-3">Sign-in Successful!</h4>
                    <p th:text="${message}">You have successfully signed in. Welcome to our platform!</p>
                    <button type="button" class="btn btn-success mt-3" data-dismiss="modal" onclick="redirectToHomepage()">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
